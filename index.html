<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 관리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- 1. 제목 -->
    <header class="app-header">
      <h1>할 일 관리</h1>
      <p class="today" id="today"></p>
    </header>

    <!-- 2. 입력 영역 -->
    <form class="todo-form" id="todo-form">
      <input type="text" id="todo-input" class="todo-input" placeholder="할 일을 입력하세요" autocomplete="off">
      <select id="todo-category" class="todo-category">
        <option value="업무">업무</option>
        <option value="개인">개인</option>
        <option value="공부">공부</option>
      </select>
      <button type="submit" class="btn-add">추가</button>
    </form>

    <!-- 3. 진행률 영역 -->
    <section class="progress" id="progress">
      <div class="progress-total">
        <div class="progress-label">
          <span>전체 진행률</span>
          <span id="progress-total-text">0 / 0, 0%</span>
        </div>
        <div class="bar"><div class="bar-fill" id="progress-total-bar" style="width: 0%"></div></div>
      </div>
      <ul class="progress-categories">
        <li class="cat-work" data-category="업무">
          <span class="progress-label"><span>업무</span><span class="cat-count">0 / 0</span></span>
          <div class="bar bar-sm"><div class="bar-fill" style="width: 0%"></div></div>
        </li>
        <li class="cat-personal" data-category="개인">
          <span class="progress-label"><span>개인</span><span class="cat-count">0 / 0</span></span>
          <div class="bar bar-sm"><div class="bar-fill" style="width: 0%"></div></div>
        </li>
        <li class="cat-study" data-category="공부">
          <span class="progress-label"><span>공부</span><span class="cat-count">0 / 0</span></span>
          <div class="bar bar-sm"><div class="bar-fill" style="width: 0%"></div></div>
        </li>
      </ul>
    </section>

    <!-- 4. 카테고리 필터 탭 -->
    <nav class="filters" id="filters">
      <button type="button" class="filter is-active" data-filter="전체">전체</button>
      <button type="button" class="filter" data-filter="업무">업무</button>
      <button type="button" class="filter" data-filter="개인">개인</button>
      <button type="button" class="filter" data-filter="공부">공부</button>
    </nav>

    <!-- 5. 할 일 목록 (app.js의 render()가 채움) -->
    <ul class="todo-list" id="todo-list"></ul>

    <!-- 할 일이 없을 때 보여줄 안내 문구 -->
    <p class="empty" id="empty" hidden>할 일이 없어요. 위에서 추가해 보세요.</p>

  </main>

  <script src="app.js"></script>
</body>
</html>
