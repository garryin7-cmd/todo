<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하루일정</title>
  <link rel="stylesheet" href="style.css">

  <!-- PWA: 앱 설치 정보, 아이콘, 상단 바 색 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b5bdb">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="하루일정">
</head>
<body>
  <main class="app">

    <!-- 제목 (모든 탭 공통) -->
    <header class="app-header">
      <h1>하루<br>일정</h1>
      <p class="today" id="today"></p>
    </header>

    <!-- 🏥 외래 D-day · ⚠️ 약 재고 경고 (모든 탭 공통, dday.js가 채움) -->
    <div class="top-bar" id="top-bar"></div>

    <!-- ===== 탭 1: 할 일 ===== -->
    <section class="view" id="view-todo" data-view="todo">

    <!-- 1. 📌 중요 일정 D-day (dday.js가 채움) -->
    <div class="dday-events" id="dday-events"></div>

    <!-- 2. 입력 영역 -->
    <form class="todo-form" id="todo-form">
      <textarea id="todo-input" class="todo-input" rows="1" placeholder="할 일을 입력하세요" autocomplete="off" enterkeyhint="done"></textarea>
      <input type="date" id="todo-due" class="todo-due" title="마감일 (비워 두면 없음)">
      <select id="todo-category" class="todo-category">
        <option value="업무">업무</option>
        <option value="개인">개인</option>
        <option value="공부">공부</option>
      </select>
      <button type="submit" class="btn-add">추가</button>
    </form>

    <!-- 3. 진행률 영역 -->
    <section class="progress" id="progress">
      <div class="progress-total">
        <div class="progress-label">
          <span>전체 진행률</span>
          <span id="progress-total-text">0 / 0, 0%</span>
        </div>
        <div class="bar"><div class="bar-fill" id="progress-total-bar" style="width: 0%"></div></div>
      </div>
      <ul class="progress-categories">
        <li class="cat-work" data-category="업무">
          <span class="progress-label"><span>업무</span><span class="cat-count">0 / 0</span></span>
          <div class="bar bar-sm"><div class="bar-fill" style="width: 0%"></div></div>
        </li>
        <li class="cat-personal" data-category="개인">
          <span class="progress-label"><span>개인</span><span class="cat-count">0 / 0</span></span>
          <div class="bar bar-sm"><div class="bar-fill" style="width: 0%"></div></div>
        </li>
        <li class="cat-study" data-category="공부">
          <span class="progress-label"><span>공부</span><span class="cat-count">0 / 0</span></span>
          <div class="bar bar-sm"><div class="bar-fill" style="width: 0%"></div></div>
        </li>
      </ul>
    </section>

    <!-- 4. 카테고리 필터 탭 -->
    <nav class="filters" id="filters">
      <button type="button" class="filter is-active" data-filter="전체">전체</button>
      <button type="button" class="filter cat-work" data-filter="업무">업무</button>
      <button type="button" class="filter cat-personal" data-filter="개인">개인</button>
      <button type="button" class="filter cat-study" data-filter="공부">공부</button>
    </nav>

    <!-- 5. 할 일 목록 (app.js의 render()가 채움. 비어 있으면 안내 문구도 이 안에 그림) -->
    <ul class="todo-list" id="todo-list"></ul>

    </section>

    <!-- ===== 탭 2: 복약 (meds.js가 채움) ===== -->
    <section class="view" id="view-meds" data-view="meds" hidden></section>

    <!-- ===== 탭 3: 건강수첩 (health.js가 채움) ===== -->
    <section class="view" id="view-health" data-view="health" hidden></section>

  </main>

  <!-- 마감 경고 카드 (빨간 테두리, 바깥 클릭/Esc로 닫기) -->
  <div class="overlay deadline-alert" id="deadline-alert" role="alertdialog" aria-labelledby="deadline-title">
    <div class="deadline-card">
      <div class="deadline-emoji">⏰</div>
      <h2 class="deadline-title" id="deadline-title"></h2>
      <p class="deadline-sub">할 일은 다 하셨나요?</p>
      <div class="deadline-groups" id="deadline-groups"></div>
      <small class="celebration-hint" id="deadline-hint">바깥을 누르거나 Esc를 눌러 닫기</small>
    </div>
  </div>

  <!-- 하단 탭 바 -->
  <nav class="tab-bar" id="tab-bar" role="tablist">
    <button type="button" class="tab" role="tab" data-tab="todo">
      <span class="tab-icon">✓</span><span>할 일</span>
    </button>
    <button type="button" class="tab" role="tab" data-tab="meds">
      <span class="tab-icon">💊</span><span>복약</span>
    </button>
    <button type="button" class="tab" role="tab" data-tab="health">
      <span class="tab-icon">📒</span><span>건강수첩</span>
    </button>
  </nav>

  <!-- 토스트 알림 (추가/삭제/완료 시 2초간 표시) -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 100% 달성 축하: 폭죽 그림판 + 가운데 메시지 카드 -->
  <canvas class="confetti" id="confetti"></canvas>
  <div class="celebration" id="celebration" role="status" aria-live="polite">
    <div class="celebration-card">
      <div class="celebration-emoji">🎉</div>
      <p id="celebration-message"></p>
      <blockquote class="celebration-quote" id="celebration-quote">
        <span class="quote-hanja" id="quote-hanja"></span>
        <span class="quote-reading" id="quote-reading"></span>
        <span id="quote-text"></span>
        <cite id="quote-author"></cite>
      </blockquote>
      <small class="celebration-hint">바깥을 누르거나 Esc를 눌러 닫기</small>
    </div>
  </div>

  <!-- 복약 시각 판정 카드 (제시간 / 늦음 / 이름) -->
  <div class="overlay dose-alert" id="dose-alert" role="alertdialog" aria-labelledby="dose-title">
    <div class="dose-card" id="dose-card">
      <div class="dose-emoji" id="dose-emoji"></div>
      <h2 class="dose-title" id="dose-title"></h2>
      <p class="dose-sub" id="dose-sub"></p>
      <small class="celebration-hint">바깥을 누르거나 Esc를 눌러 닫기</small>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="meds.js"></script>
  <script src="health.js"></script>
  <script src="dday.js"></script>
</body>
</html>
